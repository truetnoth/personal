title: "truetnoth"
description: "Personal notes, essays, and technical writing."
url: "https://truetnoth.github.io"
baseurl: "/personal"
lang: "ru"
timezone: "Europe/Moscow"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

