<header class="site-header">
  <a class="site-title plain" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  <nav class="site-nav" aria-label="Primary navigation">
    <a class="muted plain" href="{{ '/about/' | relative_url }}">About</a>
    <a class="muted plain" href="{{ '/writing/' | relative_url }}">Writing</a>
    <a class="muted plain" href="{{ '/topics/' | relative_url }}">Topics</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Toggle dark mode" aria-checked="false">

    <span class="theme-toggle-switch" aria-hidden="true"></span>
  </button>
</header>
