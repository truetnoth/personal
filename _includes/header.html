<header class="site-header">
  <a class="site-title plain" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  <nav class="site-nav" aria-label="Основная навигация">
    <a class="muted plain" href="{{ '/about/' | relative_url }}">Обо мне</a>
    <a class="muted plain" href="{{ '/writing/' | relative_url }}">Пишу</a>
    <a class="muted plain" href="{{ '/topics/' | relative_url }}">Темы</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Переключить темную тему" aria-checked="false">
    <span class="theme-toggle-slide" aria-hidden="true"></span>
    <span class="theme-toggle-switch" aria-hidden="true">
      <svg class="toggle-icon toggle-sun" viewBox="0 0 12 12" width="12" height="12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6" cy="6" r="2.2" fill="currentColor"/>
        <line x1="6" y1="1"   x2="6"   y2="2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="6" y1="9.5" x2="6"   y2="11"  stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="1"   y1="6" x2="2.5" y2="6"   stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="9.5" y1="6" x2="11"  y2="6"   stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="2.5" y1="2.5" x2="3.5" y2="3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="8.5" y1="8.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="9.5" y1="2.5" x2="8.5" y2="3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="3.5" y1="8.5" x2="2.5" y2="9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <svg class="toggle-icon toggle-moon" viewBox="0 0 12 12" width="12" height="12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10.5 6.4A4.5 4.5 0 1 1 5.6 1.5 3.5 3.5 0 0 0 10.5 6.4z" fill="currentColor"/>
      </svg>
    </span>
  </button>
</header>
