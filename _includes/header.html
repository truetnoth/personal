<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  <nav class="site-nav" aria-label="Primary navigation">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/archive/' | relative_url }}">Archive</a>
    <a href="{{ '/notes/' | relative_url }}">Notes</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Toggle dark mode" aria-checked="false">
    <span class="theme-toggle-slide" aria-hidden="true"></span>
    <span class="theme-toggle-switch" aria-hidden="true"></span>
  </button>
</header>
