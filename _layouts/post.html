---
layout: default
---

<article class="post">
  <header class="page-header">
    <p class="meta">{{ page.date | ru_date }}</p>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="content">
    {{ content }}
  </div>
  {% if page.tags and page.tags.size > 0 %}
    <footer class="tags" aria-label="Tags">
      {% for tag in page.tags %}
        {% assign tag_slug = tag | slugify %}
        <a href="{{ '/writing/' | append: '#' | append: tag_slug | relative_url }}">{{ tag }}</a>
      {% endfor %}
    </footer>
  {% endif %}
</article>
