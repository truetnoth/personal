---
layout: default
---

<article class="post">
  <header class="page-header">
    <p class="meta">{{ page.date | ru_date }}</p>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="content">
    {{ content }}
  </div>
  {% if page.tag %}
    {% assign tag_slug = page.tag | slugify %}
    <footer class="tags" aria-label="Tags">
      <a href="{{ '/writing/' | append: '#' | append: tag_slug | relative_url }}">{{ page.tag }}</a>
    </footer>
  {% endif %}
</article>
