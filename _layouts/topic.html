---
layout: default
---

<article class="page">
  <header class="page-header">
    <h1><a class="plain muted" href="{{ '/topics/' | relative_url }}">Темы</a> / {{ page.topic | escape }}</h1>
  </header>
  <div class="content">
    {% assign count = page.topic_posts | size %}
    <p class="meta">{{ count }} {% if count == 1 %}пост{% elsif count > 1 and count < 5 %}поста{% else %}постов{% endif %} по этой теме</p>

    {% include post-list.html posts=page.topic_posts %}
  </div>
</article>
